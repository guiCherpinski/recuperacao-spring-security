# Passo 6: NENHUM segredo real neste arquivo. Os valores vêm de variáveis de ambiente.
spring.application.name=api-segura
spring.jpa.hibernate.ddl-auto=update

# Segredo de assinatura do JWT (mínimo de 32 caracteres). Sem valor padrão de propósito:
# se a variável JWT_SECRET não existir, a aplicação não sobe.
app.jwt.secret=${JWT_SECRET}
# Validade do token em milissegundos (padrão: 15 minutos)
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:900000}

# Passo 12: origens permitidas no CORS, separadas por vírgula
app.cors.origens=${CORS_ORIGENS:http://localhost:3000}

# Usuário administrador criado na primeira execução (apenas para desenvolvimento/testes)
app.admin.login=${ADMIN_LOGIN:admin}
app.admin.senha=${ADMIN_SENHA}
