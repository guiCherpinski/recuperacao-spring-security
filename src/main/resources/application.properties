# Passo 6: Segredos lidos de variáveis de ambiente com valores padrão para desenvolvimento local
spring.application.name=api-segura
spring.jpa.hibernate.ddl-auto=update

# Segredo de assinatura do JWT (mínimo de 32 caracteres).
# Lê da variável JWT_SECRET; se não definida (ex.: direto na IDE), usa valor padrão de desenvolvimento.
app.jwt.secret=${JWT_SECRET:segredo-padrao-de-desenvolvimento-com-mais-de-32-caracteres}
# Validade do token em milissegundos (padrão: 15 minutos)
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:900000}

# Passo 12: origens permitidas no CORS, separadas por vírgula
app.cors.origens=${CORS_ORIGENS:http://localhost:3000}

# Usuário administrador criado na primeira execução (apenas para desenvolvimento/testes)
app.admin.login=${ADMIN_LOGIN:admin}
app.admin.senha=${ADMIN_SENHA:SenhaAdmin@12345}
